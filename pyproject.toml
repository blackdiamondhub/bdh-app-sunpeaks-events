[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-sunpeaks-events"
version = "1.0.0"
description = "Black Diamond Hub app: Sun Peaks Resort events as a shareable calendar feed"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.35,<1",
    "beautifulsoup4",
    "requests",
    "Pillow",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-sunpeaks-events"

[project.entry-points."blackdiamondhub.plugins"]
sunpeaks_events = "sunpeaks_events.plugin:spec"

[tool.setuptools.packages.find]
include = ["sunpeaks_events", "sunpeaks_events.*"]

[tool.setuptools.package-data]
sunpeaks_events = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
    "tests/*.html",
]
